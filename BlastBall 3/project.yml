name: BlastBall
options:
  bundleIdPrefix: com.rockspot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BlastBall:
    type: application
    platform: iOS
    sources: [App, Sources]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Blast Ball
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockspot.blastball
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  BlastBallTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BlastBall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BlastBall.app/BlastBall"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BlastBall:
    build:
      targets:
        BlastBall: all
    test:
      targets: [BlastBallTests]
